<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPLATE — copy me for a new Muse Spark game</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
/* New games: copy this file to games/<name>.html, register it with
 *   node scripts/add-game.mjs --add games/<name>.html --title "..." --renderer 2d
 * then wire the boot loader with
 *   node scripts/inject-boot.mjs --game <id>
 * The injector manages the gate line below (it carries a version marker).
 * Do not start your game loop before it resolves.
 */
/*MUSE-BOOT-GATE v1.0.0*/ await window.MuseBoot.gameReady();

// --- Minimal demo game: bouncing square. Replace with your game. ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let x = 40, y = 40, dx = 3, dy = 2;
function frame() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  x += dx; y += dy;
  if (x < 0 || x > canvas.width - 30) dx = -dx;
  if (y < 0 || y > canvas.height - 30) dy = -dy;
  ctx.fillStyle = '#ff6b1a';
  ctx.fillRect(x, y, 30, 30);
  requestAnimationFrame(frame);
}
frame();
window.MuseBoot.gameStarted();
</script>
</body>
</html>
