<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play — Muse AI Hub</title>
  <meta name="description" content="Play a Muse Spark browser game in the Muse AI Hub player.">
  <link rel="stylesheet" href="assets/css/hub.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff6b1a'/%3E%3Ctext x='6' y='24' font-family='Arial' font-weight='900' font-size='20' fill='%231a0d04'%3EM%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="player-shell">
    <div class="hazard-bar" aria-hidden="true"></div>
    <header class="player-top">
      <a class="back" href="index.html">← Hub</a>
      <h1 class="player-title" id="player-title">Loading…</h1>
      <span class="player-controls-hint" id="player-hint"></span>
      <a class="btn btn-ghost" id="new-tab" href="index.html" target="_blank" rel="noopener">Open raw</a>
      <button class="btn btn-primary" id="fullscreen" type="button">Fullscreen</button>
    </header>
    <main class="frame-wrap" id="frame-wrap">
      <iframe id="frame" title="Game" allowfullscreen></iframe>
    </main>
  </div>
  <script src="assets/js/play.js" defer></script>
</body>
</html>
